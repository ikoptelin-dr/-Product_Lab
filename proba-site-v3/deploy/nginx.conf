# Proba Lab — тестовый сервер. Сайт — статика из dist/ (node scripts/build.mjs).
# Адреса пока с .html: ссылки между страницами относительные, поэтому сайт работает и с диска, и в превью.
# Переход на чистые адреса (/dokumenty/otkaznoe-pismo/) — перед продом: сборка с абсолютными ссылками + 301 с .html.
server {
    listen 80;
    server_name _;                      # TODO: домен (proba-lab.ru) и HTTPS (certbot --nginx)
    root /var/www/proba-lab/dist;
    index index.html;
    charset utf-8;
    server_tokens off;
    autoindex off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/xml text/plain image/svg+xml;

    # Заголовки безопасности — в отдельном блоке, повторяются в каждом location с add_header
    # (nginx не наследует add_header, если в location есть свой)
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Тестовая выкладка — закрыть от индексации, пока сайт на проверке (перед продом удалить)
    add_header X-Robots-Tag "noindex, nofollow" always;
    # После HTTPS: add_header Strict-Transport-Security "max-age=31536000" always;

    error_page 404 /404.html;

    # Переехавшие страницы
    location = /kalkulyator-sku.html                { return 301 /analitika/kalkulyator-yunit-ekonomiki.html; }
    location = /dokumenty/sanpin.html               { return 301 /dokumenty/proverki-rospotrebnadzora.html; }
    location = /blog/ekonomika-sku-marketplejs.html { return 301 /blog/yunit-ekonomika-prostymi-slovami.html; }
    location = /dokumenty/kak-my-rabotaem.html      { return 301 /kak-my-rabotaem.html; }

    # Разделы без слэша: относительные ссылки внутри них работают только со слэшем или с index.html
    location ~ ^/(dokumenty|blog)$ { return 301 /$1/index.html; }
    location ~ ^/(dokumenty|blog)/$ { return 301 /$1/index.html; }

    location / {
        try_files $uri $uri.html =404;
    }

    # Ассеты: в ссылках ?v=<хеш>, поэтому можно кешировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
