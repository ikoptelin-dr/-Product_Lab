services:
  web:
    build:
      context: .
      args:
        STRICT_PLACEHOLDERS: "true"
    env_file: .env.production
    restart: unless-stopped
    expose: ["3000"]
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
volumes:
  caddy_data:
